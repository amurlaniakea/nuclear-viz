<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="nv-mode" content="api" />
  <title>Nuclear Viz</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg" />
  <link rel="stylesheet" href="/static/assets/style.css" />
</head>
<body>
  <header>
    <div class="motto">«Tecnósfera al servicio de la Biósfera.» — «La Paz Es El Camino.»</div>
    <h1><span class="logo-icon" aria-hidden="true">☢</span> Nuclear Viz</h1>
    <p>Visualización educativa de cadenas de decaimiento nuclear</p>
  </header>

  <main>
    <section class="controls">
      <label for="chain-select">Cadena:</label>
      <select id="chain-select"></select>

      <div class="legend">
        <span class="legend-item"><span class="swatch alpha"></span>α</span>
        <span class="legend-item"><span class="swatch beta-minus"></span>β−</span>
        <span class="legend-item"><span class="swatch beta-plus"></span>β+/EC</span>
        <span class="legend-item"><span class="swatch stable"></span>estable</span>
      </div>

      <span class="export-buttons">
        <button id="export-svg" type="button" title="Descargar el gráfico como SVG vectorial">Exportar SVG</button>
        <button id="export-png" type="button" title="Descargar el gráfico como imagen PNG">Exportar PNG</button>
        <span id="export-status" class="hint" aria-live="polite"></span>
      </span>
    </section>

    <form id="nuclide-search" class="search" role="search" autocomplete="off">
      <label for="nuclide-query">Buscar núclido:</label>
      <input id="nuclide-query" type="text" placeholder="Pb-214, 214Pb, Pa-234m" maxlength="12" spellcheck="false" />
      <button type="submit">Buscar</button>
      <small class="hint">Fuera del dataset local se consulta IAEA Livechart (ENSDF).</small>
    </form>
    <section id="search-result" class="search-result" aria-live="polite" hidden></section>
    <section id="levels-panel" class="levels-panel" aria-live="polite" hidden></section>

    <section class="layout">
      <div id="chart" aria-label="Carta de núclidos de la cadena seleccionada"></div>
      <aside id="detail">Cargando...</aside>
    </section>

    <section class="table-section">
      <h2>Núclidos</h2>
      <table id="nuclide-table">
        <thead>
          <tr>
            <th>Núclido</th>
            <th>Z</th>
            <th>N</th>
            <th>A</th>
            <th>Vida media</th>
            <th>Modos</th>
            <th>Estable</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/static/nuclide-search.js"></script>
  <script src="/static/levels.js"></script>
  <script src="/static/export.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
